[workspace]
members = [
    "event-sourcing",
    "event-sourcing-logstore-inmemory",
    "event-sourcing-logstore-sqlite",
    "event-sourcing-commands",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.220", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
futures-core = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
